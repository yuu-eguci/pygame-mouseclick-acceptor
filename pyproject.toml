[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "accept-mouse-click"
version = "2.0.0"
description = "Turn pygame mouse clicks into key events."
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
pygame = ["pygame>=2.6"]
pygame-ce = ["pygame-ce>=2.5"]
dev = ["pytest>=9", "ruff>=0.17"]

[tool.setuptools]
py-modules = ["accept_mouse_click"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
